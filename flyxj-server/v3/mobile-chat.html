:root{color-scheme:light;font-family:system-ui,-apple-system,Arial,sans-serif;color:#1c2b45;background:#f5f7fb}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overscroll-behavior:none}button,textarea{font:inherit}button{cursor:pointer}.screen{height:100%;height:100dvh;min-height:0;display:flex;flex-direction:column}.top{background:#172a50;color:#fff;padding:14px 16px max(14px,env(safe-area-inset-top));display:flex;gap:14px;align-items:center;flex-shrink:0;box-shadow:0 3px 15px #17264a24}.back{display:grid;place-items:center;flex-shrink:0;width:37px;height:37px;border-radius:10px;background:#314879;color:#fff;text-decoration:none;font-size:23px}.identity{flex:1;min-width:0}.identity strong{font-size:16px;display:block}.identity small{font-size:11px;display:block;margin-top:3px;color:#afc0e7}.refresh{border:0;color:#fff;background:#314879;border-radius:9px;padding:8px;font-size:19px;line-height:1}.banner{background:#ecf4ff;border-bottom:1px solid #d8e5fc;padding:8px 14px;font-size:12px;color:#44618c;flex-shrink:0}.history{flex:1;min-height:0;overflow-y:auto;padding:17px 12px 24px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}.bubble{max-width:85%;align-self:flex-start;padding:11px 13px;border-radius:13px 13px 13px 4px;background:#fff;border:1px solid #e5eafa;box-shadow:0 2px 7px #1e346313;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:#dce9ff;border-color:#cbdefb;border-radius:13px 13px 4px 13px}.bubble small{font-size:10px;color:#7184a0;display:block;margin-bottom:5px}.bubble .message{white-space:pre-wrap;font-size:14px;line-height:1.55}.bubble img{max-width:210px;max-height:210px;width:auto;height:auto;object-fit:contain;border-radius:9px;display:block;margin-top:8px;cursor:pointer}.empty{padding:40px 14px;text-align:center;color:#7b8aa4;line-height:1.6}.compose{background:#fff;border-top:1px solid #e5eaf1;padding:10px 10px max(12px,env(safe-area-inset-bottom));flex-shrink:0}.preview{display:none;font-size:12px;color:#516b98;padding:4px 8px 9px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.input-row{display:flex;gap:9px;align-items:flex-end}.attach{border:1px solid #dce4f0;border-radius:12px;display:grid;place-items:center;font-size:22px;color:#34579e;width:40px;height:42px;flex-shrink:0;cursor:pointer}.file{position:absolute;opacity:0;width:1px;height:1px}.input-row textarea{resize:none;flex:1;min-width:0;max-height:135px;min-height:42px;padding:11px 13px;border:1px solid #dce4f0;border-radius:13px;background:#fafcff;color:#1d304f;font-size:14px}.input-row textarea:focus{outline:2px solid #acc5f9}.send{border:0;background:#375ab2;color:white;font-weight:700;padding:11px 14px;border-radius:12px;height:42px;flex-shrink:0}.send:disabled{opacity:.55}.error{color:#b83347;font-size:12px;padding:0 6px 8px;min-height:0}.error:empty{display:none}.status-dot{color:#61e0a1}.alert{background:#fff8e7;color:#8b6429;border-radius:8px;padding:9px;font-size:11px;margin:2px 0 9px}

<div class="screen">
