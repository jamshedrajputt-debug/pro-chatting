plugins { id 'com.android.application' }
android {
    namespace 'com.flyxj.orders'
    compileSdk 35
    defaultConfig {
        applicationId 'com.flyxj.orders.downloadfix'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '3.0-download-fix'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
