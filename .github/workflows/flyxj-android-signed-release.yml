name: Publish signed FlyXJ Android APK update
on:
  push:
    branches:
      - flyxj-android-apk-build-20261123
    paths:
      - 'flyxj-android/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FLYXJ_KEYSTORE_B64: ${{ secrets.FLYXJ_KEYSTORE_B64 }}
      FLYXJ_STORE_PASSWORD: ${{ secrets.FLYXJ_STORE_PASSWORD }}
      FLYXJ_KEY_PASSWORD: ${{ secrets.FLYXJ_KEY_PASSWORD }}
      FLYXJ_KEY_ALIAS: flyxj
    steps:
      - uses: actions/checkout@v4
      - name: Require permanent private signing key in GitHub Secrets
        run: |
          if [ -z "$FLYXJ_KEYSTORE_B64" ] || [ -z "$FLYXJ_STORE_PASSWORD" ] || [ -z "$FLYXJ_KEY_PASSWORD" ]; then
            echo "::error::Configure FLYXJ_KEYSTORE_B64, FLYXJ_STORE_PASSWORD, FLYXJ_KEY_PASSWORD in GitHub repository Actions secrets to enable secure in-place upgrades."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare permanent signing key
        shell: bash
        run: |
          KEYSTORE="$RUNNER_TEMP/flyxj-permanent.jks"
          printf %s "$FLYXJ_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "FLYXJ_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
      - name: Build and sign production APK
        working-directory: flyxj-android
        run: gradle --no-daemon assembleRelease
      - name: Verify APK signature and release version
        shell: bash
        run: |
          set -eu
          APK="flyxj-android/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          CODE=$(sed -n -E 's/.*versionCode ([0-9]+).*/\1/p' flyxj-android/app/build.gradle | head -1)
          test -n "$CODE"
          echo "FLYXJ_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
      - name: Publish GitHub Release for automatic app update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eu
          TAG="flyxj-android-v$FLYXJ_VERSION_CODE"
          APK="flyxj-android/app/build/outputs/apk/release/app-release.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Version tag $TAG already exists. Increase versionCode for every new release."
            exit 1
          fi
          gh release create "$TAG" "$APK#FLYXJ-Order-Manager-v$FLYXJ_VERSION_CODE.apk" --title "FlyXJ Android v$FLYXJ_VERSION_CODE" --notes "FlyXJ Android app update: download and install to replace the previous signed release."
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlyXJ-Signed-Android-APK
          path: flyxj-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
