name: FLYXJ Mobile shipping, finance and logout regressions
on:
  push:
    branches: [flyxj-v8-fix-mobile-shipping-finance-20261124]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node tests/flyxj-mobile-shipping-static.js
      - run: node tests/flyxj-mobile-shipping-integration.js
      - run: node tests/flyxj-v8-check.js
      - run: node tests/flyxj-v6-integration.js
