name: FLYXJ V8 UI and data-safety checks
on:
  push:
    branches: [flyxj-v8-ux-20261124]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check V8 JS syntax, UI integration, and existing data protection
        run: node tests/flyxj-v8-check.js
      - name: Verify existing authenticated V6 API safety regression
        run: node tests/flyxj-v6-integration.js
