name: FlyXJ Android APK V2
on:
  push:
    branches: [flyxj-v4-safe-migration]
    paths:
      - 'flyxj-android-native/**'
      - '.github/workflows/flyxj-android.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout FlyXJ Android source
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager --licenses >/dev/null || true
      - name: Install Android 35 platform and build tools
        run: /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build FlyXJ Android debug APK
        working-directory: flyxj-android-native
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: FlyXJ-Android-Back-Fix-APK
          path: flyxj-android-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
