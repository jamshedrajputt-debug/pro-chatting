name: Build FlyXJ Android APK
on:
  push:
    branches:
      - flyxj-android-apk-build-20261123
    paths:
      - 'flyxj-android/**'
      - '.github/workflows/flyxj-android-apk.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK (current maintained action)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable debug APK
        working-directory: flyxj-android
        run: gradle --no-daemon --stacktrace assembleDebug assembleRelease
      - name: Upload unsigned production APK for secure offline signing
        uses: actions/upload-artifact@v4
        with:
          name: FlyXJ-Unsigned-Release-APK
          path: flyxj-android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - name: Upload official Android apksigner for secure offline signing
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-Signer-Tool
          path: |
            ${{ env.ANDROID_HOME }}/build-tools/35.0.0/apksigner
            ${{ env.ANDROID_HOME }}/build-tools/35.0.0/lib/apksigner.jar
          if-no-files-found: error
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlyXJ-Order-Manager-Download-Fix-APK
          path: flyxj-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
