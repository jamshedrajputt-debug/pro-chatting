name: Build FlyXJ Android APK
on:
  push:
    branches:
      - flyxj-android-apk-build-20261123
    paths:
      - 'flyxj-android/**'
      - '.github/workflows/flyxj-android-apk.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable debug APK
        working-directory: flyxj-android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlyXJ-Order-Manager-Download-Fix-APK
          path: flyxj-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
