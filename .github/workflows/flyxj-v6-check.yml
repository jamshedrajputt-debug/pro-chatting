name: FlyXJ V6 compatibility checks
on:
  push:
    branches:
      - flyxj-v6-professional-20261123
  workflow_dispatch:
jobs:
  node-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate V6 and existing app syntax plus safety contracts
        run: node tests/flyxj-v6-check.js
      - name: Run isolated authenticated API integration tests
        run: node tests/flyxj-v6-integration.js
