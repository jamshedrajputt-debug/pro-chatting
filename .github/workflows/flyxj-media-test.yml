name: FlyXJ Direct WhatsApp Media — Full Verification
on:
  push:
    branches: [flyxj-whatsapp-direct-media]
    paths:
      - 'flyxj-server/v3/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/flyxj-media-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact pinned dependencies
        run: npm ci --omit=dev
      - name: Verify image library and source syntax
        run: |
          node -e "console.log(require('sharp').versions.sharp)"
          find flyxj-server/v3 -name '*.js' -not -path '*/tests/*' -print0 | xargs -0 -n1 node --check
      - name: Validate actual WhatsApp direct media, private files and combined JPEG
        run: node --test flyxj-server/v3/tests/whatsapp.test.js
      - name: Validate order APIs, edit/delete and staff-only media
        run: node --test flyxj-server/v3/tests/integration.test.js
      - name: Prepare DOM test runtime
        run: npm install --no-save --package-lock=false --ignore-scripts jsdom@26
      - name: Validate Android photo collage and both-user permissions
        run: node --test flyxj-server/v3/tests/order-sheet.test.js flyxj-server/v3/tests/order-actions.test.js flyxj-server/v3/tests/maker-collage.test.js
