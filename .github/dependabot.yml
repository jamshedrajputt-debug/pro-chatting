version: 2
updates:
  # Propose safe maintenance patches for the live FlyXJ web branch weekly.
  # GitHub creates reviewable pull requests; automatic blind production merges are forbidden.
  - package-ecosystem: npm
    directory: /
    target-branch: flyxj-orders-render-free
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    versioning-strategy: increase-if-necessary
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      flyxj-nonmajor-patches:
        patterns: ["*"]
        update-types: [patch]
