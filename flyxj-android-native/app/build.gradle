plugins { id 'com.android.application' }
android {
    namespace 'com.flyxj.orders'
    compileSdk 35
    defaultConfig {
        applicationId 'com.flyxj.orders'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '2.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
